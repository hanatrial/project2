.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.card{--c:var(--g4);position:relative;text-align:left;font:inherit;color:var(--t1);cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;overflow:hidden;transition:transform .25s cubic-bezier(.32,.72,0,1),border-color .2s,background .2s,box-shadow .25s}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.card::after{content:'';position:absolute;right:-34px;top:-34px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.14;filter:blur(16px)}
.card:hover{transform:translateY(-4px);border-color:var(--c);background:var(--card-h);box-shadow:var(--shadow)}

.card span{font-size:12px;color:var(--t2);position:relative;z-index:1}
.c0{--c:var(--g2)}.c1{--c:var(--g4)}.c2{--c:var(--g5)}.c3{--c:var(--g3)}.c4{--c:var(--g1)}.c5{--c:#3E7A62}

.back:hover{border-color:var(--border2)}
.list{display:grid;gap:10px;margin-top:6px}
.row{--c:var(--g4);display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--t1);background:var(--card);border:1px solid var(--border);border-left:4px solid var(--c);border-radius:14px;padding:13px 16px;transition:transform .2s,border-color .2s,background .2s}

.row .go{color:var(--c);font-weight:800;flex:none}
.empty{color:var(--t2);text-align:center;padding:40px 0}
.foot{margin-top:30px;text-align:center;font-size:11px;color:var(--t3)}
@media(max-width:560px){.top{padding:0 14px}.ts{display:none}h1{font-size:23px}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px}.pill{display:none}}
</style></head><body>
