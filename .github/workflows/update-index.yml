name: Update daftar HTML
on:
  schedule: [{cron: '*/30 * * * *'}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/build-index.js
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Commit jika berubah
        run: |
          git diff --quiet index.html && { echo "tidak ada perubahan"; exit 0; }
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add index.html && git commit -m "Perbarui daftar halaman HTML" && git push
