name: Build APK Android (Trip Jepang)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/build-apk.yml', 'icons/jepang-512.png']
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Pasang Capacitor dan buat proyek Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
      - name: Pasang kode native, izin, dan ikon
        run: |
          PKG_DIR=android/app/src/main/java/com/hanatrial/tripjepang
          mkdir -p "$PKG_DIR"
          cp native/MainActivity.java native/LokasiBgPlugin.java native/LokasiService.java "$PKG_DIR/"
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          izin='''    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
          '''
          if 'FOREGROUND_SERVICE_LOCATION' not in s:
              s=s.replace('<uses-permission android:name="android.permission.INTERNET" />','<uses-permission android:name="android.permission.INTERNET" />\n'+izin,1)
          if 'LokasiService' not in s:
              s=s.replace('</application>','        <service android:name=".LokasiService" android:foregroundServiceType="location" android:exported="false" />\n    </application>',1)
          open(p,'w').write(s)
          print(s)
          PY
          # ikon aplikasi dari ikon Jepang
          sudo apt-get install -y -qq imagemagick >/dev/null
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            mkdir -p $RES/mipmap-$1
            convert ../icons/jepang-512.png -resize ${2}x${2} $RES/mipmap-$1/ic_launcher.png
            cp $RES/mipmap-$1/ic_launcher.png $RES/mipmap-$1/ic_launcher_round.png
            rm -f $RES/mipmap-$1/ic_launcher_foreground.png
          done
      - name: Sinkron dan build APK (debug, bisa dipasang langsung)
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Terbitkan ke Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/trip-jepang.apk
          ls -la out
          gh release delete apk --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk out/trip-jepang.apk --repo "$GITHUB_REPOSITORY" --title "Trip Jepang (Android)" --notes "APK Android Trip Jepang dengan lokasi latar belakang. Pasang manual (izinkan pasang dari sumber tidak dikenal). Dibuat otomatis dari android-app/ ($GITHUB_SHA)."
