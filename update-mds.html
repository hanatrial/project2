<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update untuk MDS</title>
<meta name="theme-color" content="#072E23">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6F1E8;--card:rgba(255,255,255,.8);--border:rgba(7,46,35,.12);--t1:#072E23;--t2:#4B6B5E;--ac:#1D4D43}
@media(prefers-color-scheme:dark){:root{--bg:#051E20;--card:rgba(207,231,213,.07);--border:rgba(207,231,213,.14);--t1:#E3F0E6;--t2:#8FB2A1;--ac:#9CC4B0}}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:linear-gradient(180deg,#F1F8F2,var(--bg) 45%,#D7E8D9) fixed;color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased}
@media(prefers-color-scheme:dark){body{background:linear-gradient(180deg,#0B3A33,#051E20 55%,#03161A) fixed}}
.top{background:#072E23;color:#EAF4EC;height:56px;padding:0 18px;display:flex;align-items:center;font-weight:800;font-size:15px}
main{max-width:680px;margin:0 auto;padding:24px 16px 60px}
.eye{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);background:rgba(29,77,67,.12);border:1px solid rgba(29,77,67,.25);padding:3px 12px;border-radius:20px}
h1{font-size:26px;font-weight:800;margin:10px 0 6px;letter-spacing:-.02em}
.sub{color:var(--t2);font-size:13px;line-height:1.5;margin-bottom:20px}
.t{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--ac);border-radius:16px;padding:16px;margin-bottom:12px}
.no{flex:none;width:34px;height:34px;border-radius:11px;background:#072E23;color:#CFE7D5;display:grid;place-items:center;font-weight:800}
@media(prefers-color-scheme:dark){.no{background:#CFE7D5;color:#072E23}}
.t h2{font-size:16px;font-weight:800;line-height:1.3}.t p{font-size:13px;color:var(--t2);margin-top:4px;line-height:1.5}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#072E23;color:#CFE7D5;text-decoration:none;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px}
.go:hover{background:#1D4D43}
@media(prefers-color-scheme:dark){.go{background:#CFE7D5;color:#072E23}}
.foot{text-align:center;font-size:11px;color:var(--t2);margin-top:24px}
</style></head><body>
<div class="top">Update untuk MDS</div>
<main>
<span class="eye">Nutrifood Sulawesi</span>
<h1>Yang perlu dikerjakan MDS</h1>
<p class="sub">Daftar update dan tugas untuk MDS. Ketuk tombol di tiap poin untuk langsung membuka halamannya.</p>
<div id="list"></div>
<div class="foot" id="f"></div>
</main>
<script>
/* Tambah poin baru di sini: {judul, ket (opsional), link, tombol (opsional)} */
const TUGAS=[
  {judul:'Beli Barang dan Validasi Display Wow',ket:'',link:'https://hanatrial.github.io/VISIT/',tombol:'Buka MDS Visit'},
  {judul:'Visit Toko Bulanan',ket:'',link:'https://hanatrial.github.io/noo/visit-mds.html',tombol:'Buka Visit MDS'},
  {judul:'Konsinyasi (khusus Bulukumba)',ket:'Khusus MDS Bulukumba.',link:'https://hanatrial.github.io/noo/konsinyasi/',tombol:'Buka Konsinyasi'}
];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('list').innerHTML=TUGAS.map((t,i)=>`<div class="t"><div class="no">${i+1}</div><div><h2>${esc(t.judul)}</h2>${t.ket?`<p>${esc(t.ket)}</p>`:''}<a class="go" href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.tombol||'Buka')} ↗</a></div></div>`).join('');
</script></body></html>
